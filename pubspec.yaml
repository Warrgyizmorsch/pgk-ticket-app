name: pgk_ticket_app
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  intl: ^0.20.2
  dropdown_button2: ^3.1.0
  dio: ^5.9.0
  http: ^1.4.0
  shared_preferences: ^2.5.5
  country_code_picker: ^3.4.1
  flutter_tts: ^4.2.5
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  google_sign_in: ^6.2.1
  firebase_auth: ^6.1.0
  fluttertoast: ^8.2.12
  url_launcher: ^6.3.0
  audio_session: ^0.1.21
  app_settings: ^5.1.1
  permission_handler: ^11.3.0
  razorpay_flutter: ^1.3.6
  image_picker: ^1.2.3
  share_plus: ^13.2.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # This enables code generation for your localization (.arb) files
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/Poppins/  # Correctly includes the folder

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900